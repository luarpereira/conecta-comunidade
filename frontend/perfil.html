<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Conecta Comunidade 🤝</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .profile-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .profile-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            border-top: 5px solid #2563eb;
        }
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .profile-user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .profile-avatar {
            width: 75px;
            height: 75px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
        .profile-info h2 {
            margin: 0 0 6px 0;
            color: #0f172a;
            font-size: 1.6rem;
        }
        .badge-tipo {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .detail-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .detail-label {
            display: block;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .detail-value {
            color: #0f172a;
            font-size: 1rem;
            font-weight: 500;
            word-break: break-word;
        }
        .profile-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn-edit {
            background: #2563eb;
            color: white;
        }
        .btn-edit:hover {
            background: #1d4ed8;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
        }
        .btn-logout:hover {
            background: #dc2626;
        }
        .edit-form-group {
            margin-bottom: 15px;
        }
        .edit-form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }
        .edit-form-group input, .edit-form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- NAVBAR PADRÃO -->
    <header class="navbar">
        <div class="logo">
            <h2>Conecta Comunidade 🤝</h2>
        </div>
        <nav class="nav-links" id="nav-links">
            <a href="/">História</a>
            <a href="/mural">Mural de Ajudas</a>
            <a href="/prestadores">Mapa de Prestadores</a>
            <a href="/perfil" class="active">Meu Perfil</a>
        </nav>
        <div class="nav-actions" id="nav-actions"></div>
    </header>

    <!-- CONTEÚDO DO PERFIL -->
    <main class="profile-container">
        <div class="profile-card">
            
            <div class="profile-header">
                <div class="profile-user-info">
                    <div class="profile-avatar" id="avatar-inicial">U</div>
                    <div>
                        <h2 id="view-nome">Carregando...</h2>
                        <span class="badge-tipo" id="view-tipo">morador</span>
                    </div>
                </div>
            </div>

            <!-- MODO DE VISUALIZAÇÃO -->
            <div id="view-mode">
                <div class="profile-grid">
                    <div class="detail-box">
                        <span class="detail-label">E-mail de Contato</span>
                        <span class="detail-value" id="view-email">-</span>
                    </div>
                    <div class="detail-box">
                        <span class="detail-label">Localização</span>
                        <span class="detail-value" id="view-localizacao">-</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button type="button" id="btn-habilitar-edicao" class="btn-action btn-edit">Editar Perfil</button>
                    <button type="button" id="btn-sair" class="btn-action btn-logout">Sair da Conta</button>
                </div>
            </div>

            <!-- MODO DE EDIÇÃO -->
            <form id="edit-mode" class="hidden">
                <div class="edit-form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="edit-nome" required>
                </div>
                <div class="edit-form-group">
                    <label>E-mail</label>
                    <input type="email" id="edit-email" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="edit-form-group" style="flex: 2;">
                        <label>Cidade</label>
                        <input type="text" id="edit-cidade" required>
                    </div>
                    <div class="edit-form-group" style="flex: 1;">
                        <label>Estado</label>
                        <input type="text" id="edit-estado" required>
                    </div>
                </div>
                <div class="edit-form-group">
                    <label>Tipo de Usuário</label>
                    <select id="edit-tipo">
                        <option value="morador">Morador / Beneficiário</option>
                        <option value="prestador">Prestador de Serviços</option>
                    </select>
                </div>

                <div class="profile-actions">
                    <button type="button" id="btn-cancelar" class="btn-action" style="background: #64748b; color: white;">Cancelar</button>
                    <button type="submit" class="btn-action btn-edit">Salvar Alterações</button>
                </div>
            </form>

        </div>
    </main>

    <script src="/script.js"></script>
    <script>
        let usuario = JSON.parse(localStorage.getItem('usuario'));

        if (!usuario || !usuario.email) {
            alert('Você precisa estar logado para acessar o perfil.');
            window.location.href = '/';
        } else {
            preencherDadosNaTela(usuario);
        }

        function preencherDadosNaTela(user) {
            document.getElementById('view-nome').textContent = user.nome || 'Usuário';
            document.getElementById('view-email').textContent = user.email || '-';
            document.getElementById('view-tipo').textContent = user.tipo || 'morador';
            document.getElementById('view-localizacao').textContent = `${user.cidade || 'São Paulo'} / ${user.estado || 'SP'}`;
            document.getElementById('avatar-inicial').textContent = user.nome ? user.nome.charAt(0).toUpperCase() : 'U';
        }

        // Ativar modo de edição
        document.getElementById('btn-habilitar-edicao').addEventListener('click', () => {
            document.getElementById('edit-nome').value = usuario.nome || '';
            document.getElementById('edit-email').value = usuario.email || '';
            document.getElementById('edit-cidade').value = usuario.cidade || 'São Paulo';
            document.getElementById('edit-estado').value = usuario.estado || 'SP';
            document.getElementById('edit-tipo').value = usuario.tipo || 'morador';

            document.getElementById('view-mode').classList.add('hidden');
            document.getElementById('edit-mode').classList.remove('hidden');
        });

        // Cancelar edição
        document.getElementById('btn-cancelar').addEventListener('click', () => {
            document.getElementById('edit-mode').classList.add('hidden');
            document.getElementById('view-mode').classList.remove('hidden');
        });

        // Enviar alterações para a API
        document.getElementById('edit-mode').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dadosAtualizados = {
                nome: document.getElementById('edit-nome').value,
                email: document.getElementById('edit-email').value,
                cidade: document.getElementById('edit-cidade').value,
                estado: document.getElementById('edit-estado').value,
                tipo: document.getElementById('edit-tipo').value
            };

            const userId = usuario.id || usuario.email;

            try {
                const response = await fetch(`/api/usuario/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosAtualizados)
                });
                const result = await response.json();

                if (response.ok) {
                    alert('Perfil atualizado com sucesso!');
                    localStorage.setItem('usuario', JSON.stringify(result.user));
                    usuario = result.user;
                    preencherDadosNaTela(usuario);

                    document.getElementById('edit-mode').classList.add('hidden');
                    document.getElementById('view-mode').classList.remove('hidden');
                } else {
                    alert('Erro ao atualizar: ' + (result.error || 'Erro desconhecido'));
                }
            } catch (err) {
                console.error('Erro:', err);
                alert('Erro de conexão com o servidor.');
            }
        });

        // Terminar sessão
        document.getElementById('btn-sair').addEventListener('click', () => {
            localStorage.removeItem('usuario');
            alert('Sessão encerrada com sucesso.');
            window.location.href = '/';
        });
    </script>
</body>
</html>
