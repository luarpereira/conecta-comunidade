<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Prestadores - Conecta Comunidade 🤝</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Leaflet CSS para o mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .prestadores-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .search-bar-container {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }
        .search-bar-container input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }
        .search-bar-container button {
            padding: 0 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-bar-container button:hover {
            background: #1d4ed8;
        }
        #map {
            height: 450px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 35px;
            border: 1px solid #e2e8f0;
        }
        .section-title {
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .prestadores-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .prestador-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            border-left: 5px solid #2563eb;
        }
        .prestador-card h3 {
            margin: 0 0 5px 0;
            color: #0f172a;
            font-size: 1.25rem;
        }
        .prestador-servico {
            font-weight: 600;
            color: #2563eb;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .prestador-bio {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .prestador-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
            font-size: 0.9rem;
            color: #64748b;
        }
        .btn-contato {
            background: #f1f5f9;
            color: #1e293b;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            transition: background 0.2s;
        }
        .btn-contato:hover {
            background: #e2e8f0;
        }
        .empty-message {
            text-align: center;
            color: #64748b;
            padding: 40px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- NAVBAR PADRÃO -->
    <header class="navbar">
        <div class="logo">
            <h2>Conecta Comunidade 🤝</h2>
        </div>
        <nav class="nav-links" id="nav-links">
            <a href="/">História</a>
            <a href="/mural">Mural de Ajudas</a>
            <a href="/prestadores" class="active">Mapa de Prestadores</a>
            <a href="/perfil" id="link-perfil">Meu Perfil</a>
        </nav>
        <div class="nav-actions" id="nav-actions">
            <!-- Preenchido via script.js -->
        </div>
    </header>

    <main class="prestadores-container">
        <p style="color: #475569; margin-bottom: 20px;">Explore no mapa abaixo os voluntários e profissionais disponíveis na sua zona.</p>

        <!-- BARRA DE PESQUISA E FILTRO -->
        <div class="search-bar-container">
            <input type="text" id="input-pesquisa" placeholder="Pesquisar por nome, serviço ou especialidade (ex: Eletricista, Aulas)...">
            <button type="button" id="btn-pesquisar">Pesquisar</button>
        </div>

        <!-- MAPA -->
        <div id="map"></div>

        <h2 class="section-title">Prestadores Cadastrados</h2>
        <div class="prestadores-grid" id="lista-prestadores">
            <!-- Os prestadores serão injetados dinamicamente aqui -->
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/script.js"></script>
    <script>
        let mapaGlobal = null;
        let marcadoresCamada = [];

        const coordenadasCidades = {
            'sao paulo': [-23.5505, -46.6333],
            'osasco': [-23.5329, -46.7917],
            'guarulhos': [-23.4628, -46.5333],
            'santo andre': [-23.6647, -46.5383],
            'sao bernardo do campo': [-23.6914, -46.5644],
            'diadema': [-23.6861, -46.6222]
        };

        function inicializarMapa() {
            mapaGlobal = L.map('map').setView([-23.5505, -46.6333], 11);
            
            // Camada original Esri World Street Map (visual exato da primeira imagem, livre e sem chave de API)
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012',
                maxZoom: 19
            }).addTo(mapaGlobal);
        }

        async function buscarEExibirPrestadores(termoFiltro = '') {
            try {
                const response = await fetch('/api/usuarios');
                if (!response.ok) return;
                
                const todosUsuarios = await response.json();
                
                // Filtra prestadores ou utilizadores que preencheram o campo serviço
                const prestadores = todosUsuarios.filter(u => u.tipo === 'prestador' || (u.servico && u.servico.trim() !== ''));
                renderizarDados(prestadores, termoFiltro);
            } catch (e) {
                console.error('Erro ao carregar prestadores:', e);
            }
        }

        function renderizarDados(lista, filtro) {
            const containerLista = document.getElementById('lista-prestadores');
            containerLista.innerHTML = '';

            marcadoresCamada.forEach(m => mapaGlobal.removeLayer(m));
            marcadoresCamada = [];

            const termo = filtro.toLowerCase().trim();
            const filtrados = lista.filter(p => {
                const nomeMatch = p.nome && p.nome.toLowerCase().includes(termo);
                const servicoMatch = p.servico && p.servico.toLowerCase().includes(termo);
                const bioMatch = p.bio && p.bio.toLowerCase().includes(termo);
                return !termo || nomeMatch || servicoMatch || bioMatch;
            });

            if (filtrados.length === 0) {
                containerLista.innerHTML = `<div class="empty-message">Nenhum prestador encontrado com o termo "${filtro}".</div>`;
                return;
            }

            filtrados.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'prestador-card';
                card.innerHTML = `
                    <h3>${p.nome || 'Nome não divulgado'}</h3>
                    <div class="prestador-servico">${p.servico || 'Prestador de Serviços'}</div>
                    <div class="prestador-bio">${p.bio || 'Sem biografia informada.'}</div>
                    <div class="prestador-footer">
                        <span>📍 ${p.cidade || 'São Paulo'} (${p.estado || 'SP'})</span>
                        <a href="https://wa.me/55${(p.telefone || '').replace(/\D/g,'')}" target="_blank" class="btn-contato">📞 Entrar em Contato</a>
                    </div>
                `;
                containerLista.appendChild(card);

                const cidadeKey = (p.cidade || 'sao paulo').toLowerCase().trim();
                let coords = coordenadasCidades[cidadeKey] || [-23.5505 + (index * 0.02), -46.6333 + (index * 0.02)];

                const marker = L.marker(coords).addTo(mapaGlobal);
                marker.bindPopup(`<b>${p.nome}</b><br><span style="color:#2563eb; font-weight:600;">${p.servico || 'Prestador'}</span><br><small>${p.cidade || 'São Paulo'}</small>`);
                marcadoresCamada.push(marker);
            });
        }

        document.getElementById('btn-pesquisar').addEventListener('click', () => {
            const texto = document.getElementById('input-pesquisa').value;
            buscarEExibirPrestadores(texto);
        });

        document.getElementById('input-pesquisa').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                buscarEExibirPrestadores(e.target.value);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            inicializarMapa();
            buscarEExibirPrestadores();
        });
    </script>
</body>
</html>
